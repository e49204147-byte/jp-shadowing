<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📱 盲聽抽背機</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #121212; 
            color: #ffffff; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            box-sizing: border-box; 
        }
        .card { 
            background: #1e1e1e; 
            width: 100%; 
            max-width: 400px; 
            border-radius: 16px; 
            padding: 25px; 
            box-sizing: border-box; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); 
            margin-top: 10px; 
        }
        .status-display { 
            font-size: 24px; 
            font-weight: bold; 
            text-align: center; 
            margin-bottom: 25px; 
            color: #888;
        }
        .kanji-display { 
            font-size: 28px; 
            font-weight: bold; 
            text-align: center; 
            margin-bottom: 20px; 
            line-height: 1.3;
            color: #deff9a;
        }
        .hidden { display: none !important; }
        
        .btn { 
            width: 100%; 
            padding: 16px; 
            border: none; 
            border-radius: 12px; 
            font-size: 18px; 
            font-weight: bold; 
            margin-bottom: 12px; 
            cursor: pointer; 
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-audio { background: #4facfe; color: white; }
        .btn-reveal { background: #444; color: white; }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-bottom: 15px; 
            font-size: 16px; 
        }
        th, td { 
            text-align: left; 
            padding: 12px 8px; 
            border-bottom: 1px solid #333; 
            line-height: 1.4;
        }
        th { color: #aaa; width: 25%; font-weight: normal; vertical-align: top; }
        td { color: #fff; font-weight: 500; }
        .hiragana-text { color: #4facfe; font-size: 18px; }

        .score-container { 
            display: flex; 
            gap: 8px; 
            margin-top: 10px; 
        }
        .btn-score { 
            flex: 1; 
            padding: 14px 0; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            color: black; 
        }
        .btn-score:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="card">
        <div class="status-display" id="statusText">🎧 盲聽特訓中...</div>
        
        <div id="questionArea">
            <button class="btn btn-audio" onclick="playAudio()">🔊 聽音檔 (Keita)</button>
            <button id="revealBtn" class="btn btn-reveal" onclick="revealAnswer()">👀 顯示答案與解釋</button>
        </div>

        <div id="answerArea" class="hidden">
            <div class="kanji-display" id="kanjiText"></div>

            <table>
                <tr>
                    <th>讀音</th>
                    <td id="hiraganaText" class="hiragana-text"></td>
                </tr>
                <tr>
                    <th>翻譯</th>
                    <td id="cnText"></td>
                </tr>
                <tr id="grammarRow">
                    <th>文法</th>
                    <td id="grammarText"></td>
                </tr>
                <tr id="contractionRow">
                    <th>略縮</th>
                    <td id="contractionText" style="color: #f093fb;"></td>
                </tr>
                <tr id="originRow">
                    <th>原型</th>
                    <td id="originText" style="color: #facc15;"></td>
                </tr>
                <tr id="contextRow">
                    <th>情境</th>
                    <td id="contextText" style="color: #888; font-size: 14px; font-weight: normal;"></td>
                </tr>
            </table>

            <div class="score-container">
                <button class="btn-score" style="background:#22c55e;" onclick="updateWeight(1)">✅ 順暢</button>
                <button class="btn-score" style="background:#eab308;" onclick="updateWeight(5)">⚠️ 稍卡</button>
                <button class="btn-score" style="background:#ef4444;" onclick="updateWeight(10)">❌ 聽錯</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>

    <script>
        let currentItem = null;
        let weights = JSON.parse(localStorage.getItem('jp_weights_mobile') || '{}');

        window.onload = function() {
            if (typeof rawData === 'undefined' || rawData.length === 0) {
                document.getElementById('statusText').innerText = "❌ 找不到資料";
                return;
            }
            nextQuestion();
        };

        function nextQuestion() {
            let totalWeight = 0;
            const weightedPool = rawData.map(d => {
                const w = weights[d.kanji] || 10;
                totalWeight += w;
                return { ...d, wThreshold: totalWeight };
            });

            const r = Math.random() * totalWeight;
            currentItem = weightedPool.find(d => r <= d.wThreshold);

            document.getElementById('kanjiText').innerText = currentItem.kanji;
            document.getElementById('hiraganaText').innerText = currentItem.hiragana;
            document.getElementById('cnText').innerText = currentItem.cn;

            // 自動處理所有動態擴充欄位 (包含 context)
            const fields = ['grammar', 'contraction', 'origin', 'context'];
            fields.forEach(field => {
                const row = document.getElementById(field + 'Row');
                const text = document.getElementById(field + 'Text');
                if (currentItem[field]) {
                    row.classList.remove('hidden');
                    text.innerText = currentItem[field];
                } else {
                    row.classList.add('hidden');
                }
            });

            document.getElementById('statusText').classList.remove('hidden'); 
            document.getElementById('answerArea').classList.add('hidden');    
            document.getElementById('revealBtn').classList.remove('hidden');  
        }

        function playAudio() {
            if(currentItem && currentItem.audio) {
                const audio = new Audio("data:audio/mp3;base64," + currentItem.audio);
                audio.play();
            }
        }

        function revealAnswer() {
            document.getElementById('statusText').classList.add('hidden');
            document.getElementById('answerArea').classList.remove('hidden');
            document.getElementById('revealBtn').classList.add('hidden');
        }

        function updateWeight(multiplier) {
            weights[currentItem.kanji] = multiplier; 
            localStorage.setItem('jp_weights_mobile', JSON.stringify(weights));
            nextQuestion();
        }
    </script>
</body>
</html>
